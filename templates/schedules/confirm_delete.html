{% extends "base.html" %}

{% block title %}スケジュールを削除 | 盆栽管理{% endblock %}

{% block content %}
  <div class="space-y-4">
    <h1 class="text-xl font-bold text-on-surface">スケジュールを削除</h1>
    <div class="rounded-xl bg-surface-container-lowest p-4">
      <p class="text-sm text-on-surface">「{{ object }}」を削除します。この操作は取り消せません。</p>
      <form method="post" class="mt-4 flex gap-2">
        {% csrf_token %}
        <button type="submit" class="rounded-full bg-error px-6 py-2.5 font-bold text-on-error">削除する</button>
        <a href="{% url 'schedules:list' %}" class="rounded-full bg-surface-container-high px-6 py-2.5 font-bold text-on-surface-variant">キャンセル</a>
      </form>
    </div>
  </div>
{% endblock %}
