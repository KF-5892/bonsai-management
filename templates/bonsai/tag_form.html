{% extends "base.html" %}

{% block title %}{% if object %}タグを編集{% else %}タグを作成{% endif %} | 盆栽管理{% endblock %}

{% block content %}
  <div class="space-y-4">
    <h1 class="text-xl font-bold text-on-surface">
      {% if object %}タグを編集{% else %}タグを作成{% endif %}
    </h1>
    <form method="post" class="space-y-4 rounded-xl bg-surface-container-lowest p-4">
      {% csrf_token %}
      {% include "_partials/form_fields.html" %}
      <div class="flex gap-2 pt-2">
        <button type="submit" class="rounded-full bg-primary px-6 py-2.5 font-bold text-on-primary">保存</button>
        <a href="{% url 'bonsai:tag_list' %}" class="rounded-full bg-surface-container-high px-6 py-2.5 font-bold text-on-surface-variant">キャンセル</a>
      </div>
    </form>
  </div>
{% endblock %}
