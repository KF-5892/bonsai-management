{# 上部固定ヘッダー（Stitch _2 TopAppBar 準拠: グラスモーフィズム + アバター + 通知） #}
<header class="fixed inset-x-0 top-0 z-50 flex h-16 items-center justify-between bg-[#f6faf6]/80 px-4 backdrop-blur-md">
  <div class="flex items-center gap-3">
    {% if user.is_authenticated %}
      <a
        href="{% url 'accounts:settings' %}"
        class="flex h-10 w-10 items-center justify-center overflow-hidden rounded-full bg-secondary-fixed text-base font-bold text-on-secondary-fixed"
        aria-label="アカウント"
      >
        {{ user.email|slice:":1"|upper }}
      </a>
    {% endif %}
    <a href="{% url 'bonsai:home' %}" class="font-['Inter'] text-xl font-bold text-green-900">盆栽管理</a>
  </div>

  <div class="flex items-center gap-1">
    {% if user.is_authenticated %}
      <a
        href="{% url 'search' %}"
        class="rounded-full p-2 transition-colors duration-200 hover:bg-green-50"
        aria-label="検索"
      >
        <span class="material-symbols-outlined text-green-800">search</span>
      </a>
    {% endif %}

    {# Phase 3: 通知機能を実装予定 #}
    <button
      type="button"
      class="rounded-full p-2 transition-colors duration-200 hover:bg-green-50"
      aria-label="通知"
      title="通知（Phase 3 で実装予定）"
    >
      <span class="material-symbols-outlined text-green-800">notifications</span>
    </button>

    {% if not user.is_authenticated %}
      <a
        href="{% url 'account_login' %}"
        class="rounded-full px-4 py-1.5 text-sm font-bold text-primary hover:bg-green-50"
      >
        ログイン
      </a>
    {% endif %}
  </div>
</header>
