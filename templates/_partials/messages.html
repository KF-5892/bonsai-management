{% if messages %}
  <div class="mb-4 space-y-2">
    {% for message in messages %}
      {# MD3 トークンで着色。No-Line ルールに従いボーダーなし・背景色のみで区分 #}
      <div
        x-data="{ show: true }"
        x-show="show"
        x-transition
        class="flex items-start justify-between gap-3 rounded-2xl px-4 py-3 text-sm font-medium
          {% if message.tags == 'error' %}bg-error-container text-on-error-container
          {% elif message.tags == 'warning' %}bg-[#FCE4EC] text-[#BA1A1A]
          {% elif message.tags == 'success' %}bg-secondary-container text-on-secondary-container
          {% else %}bg-surface-container-high text-on-surface-variant{% endif %}"
        role="alert"
      >
        <span>{{ message }}</span>
        <button
          type="button"
          @click="show = false"
          class="text-current/70 hover:text-current"
          aria-label="閉じる"
        >
          ×
        </button>
      </div>
    {% endfor %}
  </div>
{% endif %}
