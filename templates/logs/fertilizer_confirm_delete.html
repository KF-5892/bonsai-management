{% extends "base.html" %}

{% block title %}肥料を削除 | 盆栽管理{% endblock %}

{% block content %}
  <div class="space-y-4">
    <h1 class="text-xl font-bold text-on-surface">肥料を削除</h1>
    <div class="rounded-xl bg-surface-container-lowest p-4">
      <p class="text-sm text-on-surface">
        肥料「{{ fertilizer.name }}」を削除します。この肥料を参照している作業ログの肥料欄は空欄になります。
      </p>
      <form method="post" class="mt-4 flex gap-2">
        {% csrf_token %}
        <button type="submit" class="rounded-full bg-error px-6 py-2.5 font-bold text-on-error">削除する</button>
        <a href="{% url 'logs:fertilizer_list' %}" class="rounded-full bg-surface-container-high px-6 py-2.5 font-bold text-on-surface-variant">キャンセル</a>
      </form>
    </div>
  </div>
{% endblock %}
