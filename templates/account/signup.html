{% extends "base.html" %}

{% block title %}新規登録 | 盆栽管理{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm space-y-6">
    <header class="text-center">
      <span class="material-symbols-outlined text-5xl text-primary" aria-hidden="true">potted_plant</span>
      <h1 class="text-2xl font-bold text-on-surface">新規登録</h1>
      <p class="mt-1 text-sm text-on-surface-variant">メールアドレスとパスワードだけで始められます。</p>
    </header>

    <form method="post" action="{% url 'account_signup' %}" class="space-y-4 rounded-xl bg-surface-container-lowest p-4">
      {% csrf_token %}
      {% include "account/_form_fields.html" %}
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
      {% endif %}
      <button type="submit" class="w-full rounded-full bg-primary px-6 py-3 font-bold text-on-primary">登録する</button>
    </form>

    <p class="text-center text-sm text-on-surface-variant">
      すでにアカウントをお持ちの方は
      <a href="{% url 'account_login' %}" class="font-bold text-primary">ログイン</a>
    </p>
  </div>
{% endblock %}
