{% extends "base.html" %}

{% block title %}ログアウト | 盆栽管理{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm space-y-4 rounded-xl bg-surface-container-lowest p-6 text-center">
    <h1 class="text-xl font-bold text-on-surface">ログアウトしますか？</h1>
    <p class="text-sm text-on-surface-variant">記録はこのアカウントに保存されたままです。</p>
    <form method="post" action="{% url 'account_logout' %}" class="space-y-2">
      {% csrf_token %}
      {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
      {% endif %}
      <button type="submit" class="w-full rounded-full bg-primary px-6 py-3 font-bold text-on-primary">ログアウト</button>
      <a href="{% url 'accounts:settings' %}" class="block w-full rounded-full bg-surface-container-high px-6 py-3 font-bold text-on-surface-variant">キャンセル</a>
    </form>
  </div>
{% endblock %}
